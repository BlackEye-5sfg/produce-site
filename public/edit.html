<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a2e" />
  <title>Edit — PLU Hub</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=3" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="site-header edit-header">
    <a class="brand-lockup" href="/" aria-label="PLU Hub home">
      <img class="brand-logo" src="/images/logo-256.png" alt="" width="48" height="48" />
      <span class="brand-copy">
        <span class="brand">PLU Hub</span>
        <span class="tagline">Edit catalog</span>
      </span>
    </a>
    <div class="header-tools edit-tools">
      <a class="nav-link" href="/">Catalog</a>
      <button type="button" class="nav-link nav-btn" id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="edit-main">
    <section class="edit-panel">
      <h1 class="edit-heading">Add item</h1>
      <form id="add-form" class="add-form">
        <label class="field">
          <span>Name</span>
          <input name="name" type="text" required maxlength="120" placeholder="e.g. Apple, Gala" />
        </label>
        <label class="field">
          <span>PLU</span>
          <input name="plu" type="text" inputmode="numeric" pattern="\d{4,5}" required maxlength="5" placeholder="4–5 digits" />
        </label>
        <label class="field">
          <span>Category</span>
          <select name="cat" required>
            <option value="fruit">Fruit</option>
            <option value="veg">Veg</option>
            <option value="dry">Dry</option>
          </select>
        </label>
        <p id="add-error" class="form-error hidden" role="alert"></p>
        <p id="add-ok" class="form-ok hidden" role="status"></p>
        <button class="btn-primary" type="submit">Add item</button>
      </form>
    </section>

    <section class="edit-panel">
      <div class="edit-list-head">
        <h2 class="edit-heading">All items</h2>
        <label class="search-wrap edit-search">
          <span class="sr-only">Filter items</span>
          <input id="edit-search" type="search" placeholder="Filter…" />
        </label>
      </div>
      <p class="result-meta"><span id="edit-count">0</span> items</p>
      <div id="edit-list" class="edit-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="/js/session-keep.js?v=4"></script>
  <script src="/js/search.js?v=4"></script>
  <script src="/js/edit.js?v=4"></script>
</body>
</html>

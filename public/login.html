<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a2e" />
  <title>Login — PLU Hub</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=3" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="auth-shell">
    <form class="auth-card" id="login-form">
      <a class="auth-brand-row" href="/" aria-label="PLU Hub home">
        <img class="brand-logo" src="/images/logo-256.png" alt="" width="48" height="48" />
        <span class="brand auth-brand">PLU Hub</span>
      </a>
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-sub">Manage produce PLUs</p>

      <label class="field">
        <span>Username</span>
        <input name="username" type="text" autocomplete="username" required autofocus />
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required />
      </label>

      <p id="login-error" class="form-error hidden" role="alert"></p>
      <button class="btn-primary" type="submit">Sign in</button>
      <a class="auth-back" href="/">← Back to catalog</a>
    </form>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>

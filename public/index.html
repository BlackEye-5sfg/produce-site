<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a2e" />
  <title>PLU Hub — Walmart Produce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand-lockup">
      <p class="brand">PLU Hub</p>
      <p class="tagline">Walmart produce codes — scan-ready reference</p>
    </div>
    <div class="header-tools">
      <a id="edit-link" class="nav-link" href="/login.html?next=/edit">Login</a>
      <label class="search-wrap">
        <span class="sr-only">Search produce</span>
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search name or PLU…" autocomplete="off" enterkeyhint="search" />
      </label>
    </div>
  </header>

  <nav class="cat-nav" aria-label="Categories">
    <button class="cat-btn is-active" data-cat="all" type="button">All</button>
    <button class="cat-btn" data-cat="fruit" type="button">Fruits</button>
    <button class="cat-btn" data-cat="veg" type="button">Veg</button>
    <button class="cat-btn" data-cat="dry" type="button">Dry</button>
  </nav>

  <main>
    <p class="result-meta"><span id="count">0</span> items</p>
    <div id="grid" class="produce-grid"></div>
    <p id="empty" class="empty hidden">No matches. Try another name or PLU.</p>

    <section class="labels-section" aria-labelledby="labels-heading">
      <h2 id="labels-heading">Shelf label photos</h2>
      <p class="labels-copy">Original Walmart produce strips used for this catalog.</p>
      <div class="labels-grid">
        <figure><img src="images/labels/apples-classic.png" alt="Apple variety PLU strip" loading="lazy" /><figcaption>Apples</figcaption></figure>
        <figure><img src="images/labels/apples-honeycrisp.png" alt="Honeycrisp and specialty apples PLU strip" loading="lazy" /><figcaption>Specialty apples</figcaption></figure>
        <figure><img src="images/labels/apple-cantaloupe.png" alt="Apple apricot and cantaloupe PLU strip" loading="lazy" /><figcaption>Apples &amp; melons</figcaption></figure>
        <figure><img src="images/labels/bananas-onions.png" alt="Bananas onions and potatoes PLU strip" loading="lazy" /><figcaption>Bananas &amp; dry</figcaption></figure>
        <figure><img src="images/labels/guava-mango.png" alt="Guava mango papaya PLU strip" loading="lazy" /><figcaption>Tropical fruit</figcaption></figure>
        <figure><img src="images/labels/tropical-melons.png" alt="Passion fruit pineapple watermelon PLU strip" loading="lazy" /><figcaption>Melons &amp; tropical</figcaption></figure>
        <figure><img src="images/labels/avocado-squash.png" alt="Avocado garlic squash PLU strip" loading="lazy" /><figcaption>Avocado &amp; squash</figcaption></figure>
        <figure><img src="images/labels/potatoes-tomatoes.png" alt="Potatoes and tomatoes PLU strip" loading="lazy" /><figcaption>Potatoes &amp; tomatoes</figcaption></figure>
        <figure><img src="images/labels/peppers-eggplant.png" alt="Peppers eggplant and greens PLU strips" loading="lazy" /><figcaption>Peppers &amp; eggplant</figcaption></figure>
        <figure><img src="images/labels/lettuce-cabbage.png" alt="Lettuce cabbage cucumber PLU strips" loading="lazy" /><figcaption>Lettuce &amp; cabbage</figcaption></figure>
        <figure><img src="images/labels/asparagus-greens.png" alt="Asparagus broccoli lettuce PLU strips" loading="lazy" /><figcaption>Asparagus &amp; greens</figcaption></figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>PLUs from store shelf labels · barcodes generated as UPC-A</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="/js/session-keep.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
